name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Node version is pinned in web/.nvmrc (22, which the Dockerfile also
      # uses) and constrained by "engines" in web/package.json. The npm cache is
      # keyed on the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # gofmt, go vet, go test -race, web typecheck, web lint, Vitest: the same
      # target a contributor runs before pushing.
      - name: make check
        run: make check

      # The SPA build is what ships inside the binary and, through the release
      # tag, inside the CLI. A type-clean tree that cannot build would otherwise
      # only be found at release time.
      - name: Build the SPA and the binary with it embedded
        run: make all

      - name: Verify the embedded SPA
        run: |
          test -f internal/webui/dist/index.html
          ./bin/dorgu-dashboard --version

      # The SPA must not be able to ask the network for anything: fonts and every
      # other asset are bundled (DESIGN.md section 2).
      - name: The built SPA references no external origin
        run: make web-check-no-external

      - name: Coverage of the new Go code
        run: |
          go test -cover ./pkg/report ./internal/fixtures ./internal/view ./internal/httpapi ./hack/fixture-server | tee coverage.txt
          go test -coverprofile=report.out ./pkg/report >/dev/null
          pct=$(go tool cover -func=report.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "pkg/report coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80) ? 0 : 1 }'

  # Playwright against the real server over a fixture cluster: no Kubernetes
  # needed. It builds the SPA, builds the fixture server, installs Chromium with
  # its system libraries, runs every spec (navigation, each view, the review panel,
  # the theme toggle, the five empty states, the network audit and axe in both
  # themes), then captures a screenshot of every view in both themes.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend dependencies
        run: make web-deps

      - name: Build the SPA and the fixture server
        run: make e2e-build

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Playwright
        run: npx playwright test
        working-directory: web
        env:
          CI: "true"

      # Screenshots for design review: every view, the review panels and the five
      # empty states, in the light and the dark theme.
      - name: Capture screenshots
        if: always()
        run: npx playwright test e2e/screenshots.spec.ts
        working-directory: web
        env:
          CI: "true"
          SCREENSHOTS: "1"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: web/screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
